name: Build NoReelInsta Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          printf '\n\n\n\n' | bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Extract Dylib
        run: |
          mkdir -p output extracted
          dpkg-deb -x packages/*.deb extracted
          find extracted -name "*.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: NoReelInsta-dylib
          path: output/*.dylib
