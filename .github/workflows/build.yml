name: Build NoReelInsta Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/setup-theos@v1

      - name: Build Tweak
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless

      - name: Extract Dylib
        run: |
          mkdir output
          dpkg-deb -x packages/*.deb extracted
          find extracted -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: NoReelInsta-dylib
          path: output/*.dylib
