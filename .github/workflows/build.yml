name: Build NoReelInsta Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Setup Theos
        uses: theos/setup-theos@v1

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Extract Dylib
        run: |
          mkdir -p output extracted
          dpkg-deb -x packages/*.deb extracted
          find extracted -name "*.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: NoReelInsta-dylib
          path: output/*.dylib
